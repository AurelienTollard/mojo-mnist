[workspace]
authors = ["AurelienT <tollard.aurelien1999@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-mnist"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "==3.12"
mojo = "<1.0.0"
modular = ">=26.2.0.dev2026012605,<27"

[pypi-dependencies]
numpy = ">=2.4.1, <3"
torch = { version = ">=2.10.0, <3", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.25.0, <0.26", index = "https://download.pytorch.org/whl/cu128" }
fastapi = ">=0.128.0, <0.129"
uvicorn = ">=0.40.0, <0.41"
websockets = ">=16.0, <17"
pillow = "*"

[tasks]
dataset = { cmd = "pixi run python mnist.py", description = "Manage MNIST dataset" }
mlp = { cmd = "pixi run python mlp.py", description = "Run MLP related commands"}
demo = { cmd = "pixi run python mojo_mnist/demo/server.py", description = "Run demo related commands"}
